# Keyhelm 配置示例 — 复制为 config.yaml 使用
# 所有项均可被 KEYHELM_ 前缀的环境变量覆盖

server:
  bind_addr: "0.0.0.0:8080"     # 监听地址
  cors_origins: []               # 允许的跨域来源，空 = 同源

db:
  kind: "sqlite"                 # "sqlite" | "postgres"
  sqlite_path: "./data/keyhelm.db"
  postgres_url: "postgres://keyhelm:CHANGE_ME@10.0.0.2:5432/keyhelm"
  pool_max_conns: 5

crypto:
  master_key_env: "KEYHELM_MASTER_KEY"     # 主密钥 env 变量名
  master_key_file: "./data/master.key"     # 主密钥文件路径（env 未设置时读取）
  master_key_value: ""                     # 直接内联主密钥值（KEYHELM_MASTER_KEY env 覆盖时自动填充）

auth:
  admin_username: "admin"
  admin_password_hash: ""        # argon2 hash；空 = 首次启动自动生成并打印一次
  jwt_secret_env: "KEYHELM_JWT_SECRET"     # JWT 签名密钥 env 变量名
  jwt_secret_file: "./data/jwt.secret"     # 或从文件读
  session_ttl_secs: 3600

import:
  docker_stacks_dir: "/opt/docker-stacks"
  secrets_dir: "/root/.secrets"
