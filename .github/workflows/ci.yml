name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # 现有代码有风格性 warning，暂不 -D warnings 以免阻断（后续可收紧）
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test

  web:
    name: Web UI (typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/keyhelm-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/keyhelm-web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
